# DINOv2 ViT-S over Cholec80 1fps frames. Reproduction-gate config.
encoder:
  _target_: src.encoders.dinov2.build
  name: dinov2_vits14
  image_size: 224
  pool: cls
  dtype: fp32
  l2_normalize: false

data:
  dataset: cholec80
  root: ${oc.env:BIGDIR}/endoscopy/raw/cholec80_frames

extract:
  batch_size: 64
  num_workers: 8
  out_dir: ${oc.env:BIGDIR}/endoscopy/cache
